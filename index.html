<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSU Login</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 20% 30%, rgba(255, 75, 43, 0.25), transparent 40%),
                  radial-gradient(circle at 80% 70%, rgba(58, 123, 213, 0.25), transparent 40%),
                  #ffffff;
      overflow: hidden;
      transition: opacity 0.6s ease; /* Smooth fade */
    }

    .container {
      display: flex;
      flex-direction: column;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      width: 450px;  
      max-width: 95%;
      overflow: hidden;
      animation: fadeIn 1s ease;
    }

    .logo-section {
      width: 100%;
      height: 350px;
      background: linear-gradient(135deg, #bbdbf8, #c4c7e6);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .orbit-container {
      position: relative;
      width: 220px;
      height: 220px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .orbit-container img {
      position: absolute;
      width: 120px;
      height: 120px;
      object-fit: contain;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }

    .logo1 { animation: orbitClockwise 8s infinite linear; }
    .logo2 { animation: orbitCounter 8s infinite linear; }

    @keyframes orbitClockwise {
      0% { transform: rotate(0deg) translateX(80px) rotate(0deg); z-index: 2; }
      100% { transform: rotate(360deg) translateX(80px) rotate(-360deg); z-index: 2; }
    }

    @keyframes orbitCounter {
      0% { transform: rotate(0deg) translateX(-80px) rotate(0deg); z-index: 1; }
      100% { transform: rotate(-360deg) translateX(-80px) rotate(360deg); z-index: 1; }
    }

    .form-section {
      width: 100%;
      padding: 3rem 2rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .form-section h1 {
      font-size: 2rem;
      margin-bottom: 1.5rem;
      color: #333;
    }

    button {
      width: 100%;
      padding: 0.8rem;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #ff4b2b, #ff416c);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 0.5rem;
    }

    button:hover {
      transform: scale(1.03);
      box-shadow: 0 0 10px rgba(255, 65, 108, 0.6);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }

      
    }

    
  </style>
</head>

<body>
  <div class="container">

    <div class="logo-section">
      <div class="orbit-container">
        <img src="CSU.png" alt="CSU Logo" class="logo1">
        <img src="Lib logor.png" alt="Library Logo" class="logo2">
      </div>
    </div>

    <div class="form-section">
      <h1>CSU Login</h1>

      <p id="timestamp" style="font-size:0.9rem; margin-bottom:5px;"></p>
      <p id="dateToday" style="font-size:0.9rem; margin-bottom:10px;"></p>

      <select id="department" required style="
        width:100%;
        padding:0.7rem;
        border-radius:10px;
        margin-bottom:10px;
      ">
      <option value="">Select Department</option>
      <option value="CAHS">CAHS</option>
      <option value="CBEA">CBEA</option>
      <option value="CHM">CHM</option>
      <option value="CTED">CTED</option>
      <option value="FACULTY">FACULTY</option>
      <option value="GRADUATE SCHOOL">GRADUATE SCHOOL</option>
      <option value="OTHERS">OTHERS</option>
      </select>

      <form id="loginForm">
        <button type="submit">Log In</button>
        <p id="loginCount" style="margin-top:10px; font-size:0.9rem; color:#000000;">
          Loading Log in count...
        </p>
      </form>

    </div>

  </div>

  <script>
function updateDateTime() {
  const now = new Date();

  const date = now.toLocaleDateString("en-US", {
    year: "numeric",
    month: "long",
    day: "numeric"
  });

  const time = now.toLocaleTimeString("en-US");

  document.getElementById("timestamp").innerText = "Time: " + time;
  document.getElementById("dateToday").innerText = "Date: " + date;
}

setInterval(updateDateTime, 1000);
updateDateTime();
</script>

  <script> 
    /* Smooth transition to landing page
    const form = document.getElementById('loginForm');
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      document.body.style.opacity = '0'; // fade out
      setTimeout(() => {
        window.location.href = 'csuaweb.html';
      }, 600);
    }); */
  </script> 

  <script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx36JExC7upo97m8xcHwoZrCKHGpE8foJNO5_trHvG5CbftV7TxbUzYOs3bGn7A859C/exec";

const form = document.getElementById("loginForm");
const countDisplay = document.getElementById("loginCount");

/* Always fetch fresh data */
async function loadMetrics(){
  try{
    const res = await fetch(WEB_APP_URL + "?action=get", { cache:"no-store" });
    const data = await res.json();

    countDisplay.innerHTML =
      `Total Login: ${data.lifetime} | Today's Login: ${data.today}`; 

  }catch{
    countDisplay.innerText = "Metrics unavailable";
  }
}

/* Always reload when page becomes visible */
window.addEventListener("pageshow", function () {
  loadMetrics();
});

/* Initial load */
loadMetrics();

/* Login click */
let isSubmitting = false;

form.addEventListener("submit", (e) => {
  e.preventDefault();

  if (isSubmitting) return; // prevent double click
  isSubmitting = true;

  const button = form.querySelector("button");
  const department = document.getElementById("department").value;

  if (!department) {
    alert("Please select a department to continue");
    isSubmitting = false;
    return;
  }

  button.disabled = true;
  button.innerText = "Logging in...";

  // SEND DATA
  fetch(WEB_APP_URL + `?action=increment&dept=${encodeURIComponent(department)}`,{
    method: "GET",
    keepalive: true
  }).catch(()=>{});

  // Redirect immediately (no waiting)
  document.body.style.opacity = "0";
  setTimeout(() => {
    window.location.href = "csuaweb.html";
  }, 400);

  // Fire and forget (DO NOT await)
  //fetch(WEB_APP_URL + "?action=increment", { method: "GET", keepalive: true })
    //.catch(()=>{});
});
</script>




  
</body>
</html>
